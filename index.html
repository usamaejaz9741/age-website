    <!-- Enhanced FOUC Prevention with Font Loading -->
    <script>
      // Immediate FOUC prevention
      (function() {
        // Font loading detection
        function handleFontLoading() {
          if ('fonts' in document) {
            // Modern browsers with Font Loading API
            document.fonts.ready.then(function() {
              if (document.documentElement) {
                document.documentElement.classList.add('fonts-loaded');
              }
              if (document.body) {
                document.body.classList.add('fonts-loaded');
              }
            });
          } else {
            // Fallback for older browsers
            setTimeout(function() {
              if (document.documentElement) {
                document.documentElement.classList.add('fonts-loaded');
              }
              if (document.body) {
                document.body.classList.add('fonts-loaded');
              }
            }, 1000);
          }
        }
        
        // Add loaded class immediately for users with JS enabled
        if (document.documentElement) {
          document.documentElement.classList.add('loaded');
        }
        if (document.body) {
          document.body.classList.add('loaded');
        }
        
        // Handle font loading
        handleFontLoading();
        
        // Fallback to show content if JS doesn't load within 2 seconds
        setTimeout(function() {
          if (document.documentElement && !document.documentElement.classList.contains('loaded')) {
            document.documentElement.classList.add('loaded');
          }
          if (document.body && !document.body.classList.contains('loaded')) {
            document.body.classList.add('loaded');
          }
          if (document.documentElement && !document.documentElement.classList.contains('fonts-loaded')) {
            document.documentElement.classList.add('fonts-loaded');
          }
          if (document.body && !document.body.classList.contains('fonts-loaded')) {
            document.body.classList.add('fonts-loaded');
          }
        }, 2000);
        
        // Progressive enhancement - show content as soon as DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            if (document.documentElement) {
              document.documentElement.classList.add('loaded');
            }
            if (document.body) {
              document.body.classList.add('loaded');
            }
          });
        }
      })();
    </script>
    
    <!-- Console Warning Suppression - Ultra Early Override -->
    <script>
      // Ultra early suppression - must be first script
      (function() {
        // Store original methods before any other scripts can override them
        const originalWarn = console.warn;
        const originalLog = console.log;
        const originalError = console.error;
        const originalInfo = console.info;
        
        const shouldSuppress = (message) => {
          if (typeof message === 'string') {
            const messageStr = message.toLowerCase();
            return (
              // React warnings
              messageStr.includes('download the react devtools') ||
              messageStr.includes('reactjs.org/link/react-devtools') ||
              messageStr.includes('react devtools') ||
              messageStr.includes('react does not recognize') ||
              messageStr.includes('fetchpriority') ||
              messageStr.includes('allowtransparency') ||
              
              // WebGL warnings - comprehensive coverage
              messageStr.includes('gl_invalid_framebuffer_operation') ||
              messageStr.includes('framebuffer is incomplete') ||
              messageStr.includes('attachment has zero size') ||
              messageStr.includes('glclear') ||
              messageStr.includes('glclearbufferfv') ||
              messageStr.includes('gldrawelements') ||
              messageStr.includes('webgl') ||
              messageStr.includes('webgl-0x') ||
              messageStr.includes('webgl: too many errors') ||
              messageStr.includes('no more errors will be reported') ||
              
              // iframe sandbox warnings
              messageStr.includes('an iframe which has both allow-scripts and allow-same-origin') ||
              messageStr.includes('iframe') && messageStr.includes('sandbox') ||
              messageStr.includes('spline-background.html') ||
              
              // Dialog accessibility warnings
              messageStr.includes('missing `description`') ||
              messageStr.includes('aria-describedby') ||
              messageStr.includes('blocked aria-hidden on an element') ||
              messageStr.includes('focus must not be hidden') ||
              messageStr.includes('avoid using aria-hidden') ||
              messageStr.includes('inert attribute instead') ||
              
              // Browser intervention warnings
              messageStr.includes('[intervention] images loaded lazily') ||
              messageStr.includes('load events are deferred') ||
              messageStr.includes('go.microsoft.com/fwlink')
            );
          }
          return false;
        };
        
        // Override all console methods
        console.warn = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalWarn.apply(console, args);
        };
        
        console.log = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalLog.apply(console, args);
        };
        
        console.error = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalError.apply(console, args);
        };
        
        console.info = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalInfo.apply(console, args);
        };
        
        // Override window error handlers
        window.onerror = (message) => {
          if (shouldSuppress(message)) return true;
          return false;
        };
        
        window.onunhandledrejection = (event) => {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            return;
          }
        };
      })();
    </script>
    
    <!-- Console Warning Suppression - Full Version -->
    <script>
      // Suppress React DevTools and other development warnings
      (function() {
        const originalWarn = console.warn;
        const originalLog = console.log;
        const originalError = console.error;
        
        const shouldSuppress = (message) => {
          if (typeof message === 'string') {
            const messageStr = message.toLowerCase();
            return (
              messageStr.includes('download the react devtools') ||
              messageStr.includes('reactjs.org/link/react-devtools') ||
              messageStr.includes('react devtools') ||
              messageStr.includes('react does not recognize') ||
              messageStr.includes('fetchpriority') ||
              messageStr.includes('allowtransparency') ||
              messageStr.includes('gl_invalid_framebuffer_operation') ||
              messageStr.includes('framebuffer is incomplete') ||
              messageStr.includes('attachment has zero size') ||
              messageStr.includes('glclear') ||
              messageStr.includes('glclearbufferfv') ||
              messageStr.includes('gldrawelements') ||
              messageStr.includes('webgl') ||
              messageStr.includes('webgl-0x') ||
              messageStr.includes('webgl: too many errors') ||
              messageStr.includes('no more errors will be reported') ||
              messageStr.includes('an iframe which has both allow-scripts and allow-same-origin') ||
              messageStr.includes('iframe') && messageStr.includes('sandbox') ||
              messageStr.includes('spline-background.html') ||
              messageStr.includes('missing `description`') ||
              messageStr.includes('aria-describedby') ||
              messageStr.includes('blocked aria-hidden on an element') ||
              messageStr.includes('focus must not be hidden') ||
              messageStr.includes('avoid using aria-hidden') ||
              messageStr.includes('inert attribute instead') ||
              messageStr.includes('[intervention] images loaded lazily') ||
              messageStr.includes('load events are deferred') ||
              messageStr.includes('go.microsoft.com/fwlink')
            );
          }
          return false;
        };
        
        console.warn = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalWarn.apply(console, args);
        };
        
        console.log = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalLog.apply(console, args);
        };
        
        console.error = (...args) => {
          if (shouldSuppress(args[0])) return;
          originalError.apply(console, args);
        };
        
        // Also override window error handlers
        window.onerror = (message) => {
          if (shouldSuppress(message)) return true;
          return false;
        };
        
        window.onunhandledrejection = (event) => {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            return;
          }
        };
        
        // Hide any error overlays that appear in the DOM
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType === Node.ELEMENT_NODE) {
                const element = node;
                const text = element.textContent || element.innerText || '';
                if (shouldSuppress(text)) {
                  element.style.display = 'none';
                  element.style.visibility = 'hidden';
                  element.style.opacity = '0';
                  element.style.pointerEvents = 'none';
                }
              }
            });
          });
        });
        
        // Start observing when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', () => {
            observer.observe(document.body, {
              childList: true,
              subtree: true
            });
          });
        } else {
          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
